name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - docs/**
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - docs/**

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: lint

    env:
      COGNODB_URI: ${{ secrets.COGNODB_URI }}
      COGNODB_USER: ${{ secrets.COGNODB_USER }}
      COGNODB_PASSWORD: ${{ secrets.COGNODB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_ALGORITHM: HS256
      JWT_TTL_MINUTES: 60

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version-file: ".python-version"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Unit Tests
        run: uv run pytest --ignore=app/test/test_database_connection.py

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
