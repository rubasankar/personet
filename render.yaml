services:
  - type: web
    name: pernet-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install uv && uv sync --no-dev
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.14"
      - key: ENVIRONMENT
        value: production
      # Set these in the Render dashboard - never commit real values here
      - key: COGNODB_URI
        sync: false
      - key: COGNODB_USER
        sync: false
      - key: COGNODB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_TTL_MINUTES
        value: "60"
      - key: FRONTEND_URL
        sync: false   # set to your Vercel frontend URL after deploying frontend
